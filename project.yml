name: Niblet
options:
  bundleIdPrefix: com.nsteinhafel
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

targets:
  Niblet:
    type: application
    platform: macOS
    sources:
      - path: Niblet
        excludes:
          - "**/*.entitlements"
    resources:
      - path: Niblet/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsteinhafel.Niblet
        INFOPLIST_FILE: Niblet/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Niblet/Resources/Niblet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Niblet/Resources/Niblet.entitlements

  NibletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NibletTests
    dependencies:
      - target: Niblet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nsteinhafel.NibletTests
        GENERATE_INFOPLIST_FILE: YES
